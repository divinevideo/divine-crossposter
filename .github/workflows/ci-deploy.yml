name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_failure_notification:
        description: Send a safe notification test
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:once

  deployment-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Production belongs to Divine Connections
        run: echo "This repository is retired. Production releases must come from divinevideo/divine-connections."

  notify:
    if: ${{ always() && (inputs.test_failure_notification == true || needs.test.result == 'failure') }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify workflow failure
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          NOTIFICATION_TEST: ${{ inputs.test_failure_notification }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_ALERT_WEBHOOK_URL:-}" ]; then
            echo "::error::OPS_ALERT_WEBHOOK_URL is missing or inaccessible to this workflow"
            exit 1
          fi

          event=workflow_failed
          if [ "$NOTIFICATION_TEST" = true ]; then
            event=notification_test
          fi

          payload="$(jq -cn \
            --arg service divine-crossposter \
            --arg event "$event" \
            --arg run_url "$RUN_URL" \
            '{service: $service, event: $event, runUrl: $run_url}')"
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 \
            --retry 3 --retry-all-errors \
            --header 'content-type: application/json' \
            --data-binary "$payload" \
            "$OPS_ALERT_WEBHOOK_URL"
