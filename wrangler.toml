# Local development and tests only. Production configuration lives in divine-connections.
name = "divine-crossposter-local"
workers_dev = false
main = "src/index.ts"
compatibility_date = "2025-09-06"

[vars]
KEYCAST_URL = "https://login.divine.video"
FUNNELCAKE_URL = "https://api.divine.video"
OAUTH_REDIRECT_BASE = "http://localhost:8787"
ENABLE_INSTAGRAM = "false"
INSTAGRAM_CLIENT_ID = "local-test-only"
ENABLE_TIKTOK = "false"
ENABLE_X = "false"
ENABLE_YOUTUBE = "false"

[[d1_databases]]
binding = "DB"
database_name = "divine-crossposter-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[queues.producers]]
binding = "CROSSPOST_QUEUE"
queue = "divine-crossposter-local-jobs"

[[queues.producers]]
binding = "CROSSPOST_DLQ"
queue = "divine-crossposter-local-jobs-dlq"

[[queues.consumers]]
queue = "divine-crossposter-local-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "divine-crossposter-local-jobs-dlq"
